############
# OneBusAway
############

options:
  bundleIdPrefix: com.tracktrolley.pb

targets:
  App:
    sources:
      - path: Apps/TTPB
        name: App
        group: TTPB
      - path: Apps/Shared/CommonClient
        name: Common
        group: TTPB
    entitlements:
      path: Apps/TTPB/OneBusAway.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tracktrolley.pb.iphone
        com.apple.developer.associated-domains:
          - applinks:onebusaway.co
          - applinks:www.onebusaway.co
          - applinks:alerts.onebusaway.org
        com.apple.developer.in-app-payments:
          - merchant.com.tracktrolley.pb.iphone
    info:
      path: Apps/TTPB/Info.plist
      properties:
        CFBundleDisplayName: TTPB
        CFBundleURLTypes: [{CFBundleTypeRole: "Editor", CFBundleURLIconFile: "", CFBundleURLName: "obapb", CFBundleURLSchemes: ["obapb"]}]
        LSApplicationQueriesSchemes:
          - fb
          - twitter
          - comgooglemaps
          - fb313213768708402HART
          - org.sdmts.riderapp.compassmobile.payments
          - org.sdmts.pronto
          - co.bytemark.tgt
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains: {
            "onebusaway.co": {
                NSIncludesSubdomains: true,
                NSExceptionAllowsInsecureHTTPLoads: true
            }
          }
        NSHumanReadableCopyright: © Transportation America
        NSUserActivityTypes:
          - com.tracktrolley.pb.iphone.user_activity.stop
          - com.tracktrolley.pb.iphone.user_activity.trip
        OBAKitConfig:
          AppDevelopersEmailAddress: oba@transportationamerica.com
          AppGroup: group.com.tracktrolley.pb.iphone
          BundledRegionsFileName: regions.json
          Donations:
            Enabled: false
            DonationManagementPortal: "https://onebusaway.co/manage-donations"
          ExtensionURLScheme: obapb
          PrivacyPolicyURL: https://onebusaway.org/privacy/
          PushNotificationAPIKey: d5d0d28a-6091-46cd-9627-0ce01ffa9f9e
          RESTServerAPIKey: org.onebusaway.iphone
          RegionsServerBaseAddress: https://data.tracktrolley.com
          RegionsServerAPIPath: /regions-obapb.json
    settings:
      base:
        DEVELOPMENT_TEAM: enter_your_id
        PRODUCT_BUNDLE_IDENTIFIER: com.tracktrolley.pb.iphone
  TodayView:
    sources: ["Apps/TTPB/Assets.xcassets"]
    entitlements:
      properties:
        com.apple.security.application-groups:
          - group.com.tracktrolley.pb.iphone
    info:
      properties:
        CFBundleDisplayName: TTPB
        OBAKitConfig:
          AppGroup: group.com.tracktrolley.pb.iphone
          BundledRegionsFileName: regions.json
          ExtensionURLScheme: obapb
          RESTServerAPIKey: com.tracktrolley.pby.iphone
          RegionsServerBaseAddress: https://data.tracktrolley.com
          RegionsServerAPIPath: /regions-obapb.json
    settings:
      base:
        DEVELOPMENT_TEAM: enter_your_id
        PRODUCT_BUNDLE_IDENTIFIER: com.tracktrolley.pb.iphone.TodayView
  OBAWidget:
    sources: ["Apps/TTPB/Assets.xcassets"]
    entitlements:
      properties:
        com.apple.security.application-groups:
          - group.com.tracktrolley.pb.iphone
    info:
      properties:
        CFBundleDisplayName: TTPB
        OBAKitConfig:
          AppGroup: group.com.tracktrolley.pb.iphone
          BundledRegionsFileName: regions.json
          ExtensionURLScheme: obapb
          RESTServerAPIKey: com.tracktrolley.pb.iphone
          RegionsServerBaseAddress: https://data.tracktrolley.com
          RegionsServerAPIPath: /regions-obapb.json
    settings:
      base:
        DEVELOPMENT_TEAM: enter_your_id
        PRODUCT_BUNDLE_IDENTIFIER: com.tracktrolley.pb.iphone.OBAWidget
include:
  - path: Apps/Shared/app_shared.yml
  - path: Apps/Shared/analytics_fx_config.yml
  - path: Apps/Shared/push_config.yml
  - path: OBAKitCore/project.yml
  - path: OBAKit/project.yml
  - path: OBAKitTests/project.yml
  - path: OBAKitUITests/project.yml
  - path: TodayView/project.yml
  - path: OBAWidget/project.yml
