############
# KiedyBus watch app
############
#
# Every line of watch wiring for this app. Included from project.yml only when
# OBA_WATCH is set (scripts/generate_project sets it unless given --no-watch).
# An app with no watch.yml generates exactly the project it generates today.

# This file is included with `relativePaths: false`, so these paths resolve
# from the repo root. The nested includes keep the default (paths inside
# WatchApp/project.yml resolve from WatchApp/). OBAKitWatch is a product of the
# root Package.swift.
include:
  - path: WatchApp/project.yml

targets:
  App:
    dependencies:
      - target: WatchApp
  WatchApp:
    sources:
      # A lone file inside the App target's synced folder needs an explicit
      # group: without one XcodeGen emits an orphaned `Resources` group and the
      # file resolves to the repo root ("regions.json couldn't be opened").
      - path: Apps/KiedyBus/Resources/regions.json
        group: KiedyBus
      - path: Apps/KiedyBus/Assets.xcassets
    entitlements:
      path: Apps/KiedyBus/WatchApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.pl.kiedybus.iphone
    info:
      properties:
        CFBundleDisplayName: KiedyBus
        WKCompanionAppBundleIdentifier: pl.kiedybus.iphone
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains: {
            "onebusaway.co": {
                NSIncludesSubdomains: true,
                NSExceptionAllowsInsecureHTTPLoads: true
            },
            "sidecar.onebusaway.org": {
                NSIncludesSubdomains: true,
                NSExceptionAllowsInsecureHTTPLoads: true
            }
          }
        OBAKitConfig:
          AppGroup: group.pl.kiedybus.iphone
          BundledRegionsFileName: regions.json
          RESTServerAPIKey: org.onebusaway.iphone
          RegionsServerBaseAddress: https://www.kiedybus.pl
          RegionsServerAPIPath: /regions-v3.json
    settings:
      base:
        DEVELOPMENT_TEAM: 85APG5FQFE
        PRODUCT_BUNDLE_IDENTIFIER: pl.kiedybus.iphone.watchkitapp
