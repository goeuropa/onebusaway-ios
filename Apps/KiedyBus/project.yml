############
# KiedyBus
############

options:
  bundleIdPrefix: pl.kiedybus

targets:
  App:
    sources:
      - path: Apps/KiedyBus
        name: App
        group: KiedyBus
        # gpx files are simulated-location fixtures for schemes, not app
        # resources; keep them out of the bundle. project.yml and watch.yml are
        # project wiring, not resources.
        excludes: ["gpx_files", "project.yml", "watch.yml"]
      - path: Apps/Shared/CommonClient
        name: Common
        group: KiedyBus
    entitlements:
      path: Apps/KiedyBus/KiedyBus.entitlements
      properties:
        com.apple.security.application-groups:
          - group.pl.kiedybus.iphone
        com.apple.developer.associated-domains:
          - applinks:onebusaway.co
          - applinks:www.onebusaway.co
          - applinks:sidecar.onebusaway.org
        com.apple.developer.in-app-payments:
          - merchant.pl.kiedybus.iphone
    info:
      path: Apps/KiedyBus/Info.plist
      properties:
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        CFBundleDisplayName: KiedyBus
        CFBundleURLTypes: [{CFBundleTypeRole: "Editor", CFBundleURLIconFile: "", CFBundleURLName: "kiedybus", CFBundleURLSchemes: ["kiedybus"]}]
        # fb, twitter and comgooglemaps come from Apps/Shared/app_shared.yml;
        # XcodeGen concatenates the two lists, so repeating them here duplicated them.
        LSApplicationQueriesSchemes:
          - fb313213768708402HART
          - org.sdmts.riderapp.compassmobile.payments
          - org.sdmts.pronto
          - co.bytemark.tgt
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains: {
            "onebusaway.co": {
                NSIncludesSubdomains: true,
                NSExceptionAllowsInsecureHTTPLoads: true
            },
            "sidecar.onebusaway.org": {
                NSIncludesSubdomains: true,
                NSExceptionAllowsInsecureHTTPLoads: true
            }
          }
        NSHumanReadableCopyright: © goEuropa & Open Transit Software Foundation
        NSUserActivityTypes:
          - pl.kiedybus.iphone.user_activity.stop
          - pl.kiedybus.iphone.user_activity.trip
        OBAKitConfig:
          AppDevelopersEmailAddress: info@goeuropa.eu
          AppGroup: group.pl.kiedybus.iphone
          AppStoreID: "org.onebusaway"
          BundledRegionsFileName: regions.json
          Donations:
            Enabled: false
            DonationManagementPortal: "https://opentransitsoftwarefoundation.org/manage-donations"
          ExtensionURLScheme: onebusaway
          MoreTab:
            ShowHelpOutSection: true
            DevelopURL: "https://kiedybus.pl"
          PrivacyPolicyURL: https://kiedybus.pl/polityka-prywatnosci.html
          PushNotificationAPIKey: d5d0d28a-6091-46cd-9627-0ce01ffa9f9e
          RESTServerAPIKey: org.onebusaway.iphone
          RegionsServerBaseAddress: https://kiedybus.pl
          RegionsServerAPIPath: /regions-v3.json
    settings:
      base:
        DEVELOPMENT_TEAM: 85APG5FQFE
        PRODUCT_BUNDLE_IDENTIFIER: pl.kiedybus.iphone
  OBAWidget:
    sources: ["Apps/KiedyBus/Assets.xcassets"]
    entitlements:
      properties:
        com.apple.security.application-groups:
          - group.pl.kiedybus.iphone
    info:
      properties:
        CFBundleDisplayName: KiedyBus
        OBAKitConfig:
          AppGroup: group.pl.kiedybus.iphone
          BundledRegionsFileName: regions.json
          ExtensionURLScheme: kiedybus
          RESTServerAPIKey: org.onebusaway.iphone
          RegionsServerBaseAddress: https://kiedybus.pl
          RegionsServerAPIPath: /regions-v3.json
    settings:
      base:
        DEVELOPMENT_TEAM: 85APG5FQFE
        PRODUCT_BUNDLE_IDENTIFIER: pl.kiedybus.iphone.OBAWidget
include:
  - path: OBAKitUITests/project.yml
  - path: Apps/Shared/app_shared.yml
  - path: Apps/Shared/info_plist.yml
  - path: Apps/Shared/analytics_fx_config.yml
  - path: Apps/Shared/push_config.yml
  - path: OBAKitTests/project.yml
  - path: OBAWidget/project.yml
  - path: Apps/KiedyBus/watch.yml
    relativePaths: false
    enable: ${OBA_WATCH}
  - path: Apps/Shared/healthkit.yml
    relativePaths: false
    enable: ${OBA_HEALTHKIT}
